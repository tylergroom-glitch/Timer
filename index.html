<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cue Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10151C; --panel:#1B222C; --head:#222B37; --line:#2C3542;
  --text:#DCE2E8; --dim:#8C98A5;
  --green:#3FB950; --amber:#E3B341; --red:#F85149; --blue:#6CB6FF;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#bgLayer{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-1}
button{font:inherit;color:inherit;background:#263040;border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer}
button:hover{background:#2F3B4E}
button.primary{background:#1F4E8C;border-color:#2B63AD}
button.primary:hover{background:#2660A8}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;color:var(--text);background:#131920;border:1px solid var(--line);border-radius:6px;padding:6px 9px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}

#bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(16,21,28,.85)}
#bar h1{margin:0;font-size:16px;font-weight:600;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:#46505C}
.dot.on{background:var(--green)}
.dot.flash{background:#BFF3C8}

#workspace{position:relative;height:calc(100% - 53px);overflow:hidden}
.win{position:absolute;background:rgba(27,34,44,.9);border:1px solid var(--line);border-radius:10px;
  display:flex;flex-direction:column;min-width:180px;min-height:120px;box-shadow:0 10px 30px #0006}
.win header{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 11px;background:var(--head);border-bottom:1px solid var(--line);
  border-radius:9px 9px 0 0;cursor:grab;user-select:none;font-size:13px;color:var(--dim)}
.win header .name{margin-right:auto;font-weight:500;color:var(--text)}
.win header button{padding:1px 8px;font-size:13px;background:transparent;border-color:transparent;color:var(--dim);line-height:1.3}
.win header button:hover{background:#2F3B4E;color:var(--text)}
.body{flex:1;overflow:auto;padding:12px 14px;container-type:size}
.grip{position:absolute;right:2px;bottom:2px;width:18px;height:18px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 50%,var(--line) 50%,var(--line) 60%,transparent 60%,transparent 72%,var(--line) 72%,var(--line) 82%,transparent 82%)}

#dock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap;pointer-events:none}
#dock button{pointer-events:auto;background:var(--head)}

.timer{display:flex;flex-direction:column;height:100%;justify-content:center}
.time{font-weight:500;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;text-align:center;font-size:min(38cqh,26cqw)}
.time.green{color:var(--green)}
.time.amber{color:var(--amber)}
.time.red{color:var(--red)}
.time.over{animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.35}}
.sub{color:var(--dim);text-align:center;margin-top:8px;font-size:clamp(11px,6cqh,15px)}

.arrows{display:flex;align-items:center;justify-content:center;gap:5%;height:100%}
.arrows svg{height:86%;width:45%;cursor:pointer}
.chase-svg g path{transition:none}
.chase-svg.back path{fill:var(--red)}
.chase-svg.next path{fill:var(--green)}
.chase-svg .ch1,.chase-svg .ch2,.chase-svg .ch3{opacity:.13}
.chase-svg.fire .ch1{animation:flare .55s ease-out 0s}
.chase-svg.fire .ch2{animation:flare .55s ease-out .09s}
.chase-svg.fire .ch3{animation:flare .55s ease-out .18s}
@keyframes flare{0%{opacity:.13}18%{opacity:1}55%{opacity:.9}100%{opacity:.13}}

.count{font-weight:500;font-variant-numeric:tabular-nums;line-height:1;text-align:center;font-size:min(34cqh,40cqw)}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

#log{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px}
#log div{display:grid;grid-template-columns:78px 52px 1fr;gap:8px;padding:3px 0;border-bottom:1px solid #222A35}
#log .t,#log .gap{color:var(--dim)}
#log .next{color:var(--green)}
#log .back{color:var(--amber)}
.empty{color:var(--dim);font-size:14px}
.stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #222A35;font-size:14px}
.stat span:last-child{font-variant-numeric:tabular-nums}
#remote input{width:100%;margin:6px 0}
#remote p{margin:6px 0;font-size:13px;color:var(--dim)}
#link{word-break:break-all;font-size:13px}

body.popout #bar,body.popout .grip,body.popout #dock{display:none}
body.popout #workspace{height:100%}
body.popout .win{position:static;height:100%;width:100%;border:0;border-radius:0;box-shadow:none;background:transparent}
body.popout .win header{display:none}
</style>
</head>
<body>
<div id="bgLayer"></div>

<div id="bar">
  <h1>Cue Console</h1>
  <span class="pill"><span class="dot" id="dot"></span><span id="status">Cues: not connected</span></span>
  <span class="pill"><span class="dot" id="dotT"></span><span id="statusT">Timer: not connected</span></span>
  <button class="primary" id="connect">Connect a dongle</button>
  <button id="reset">Reset count</button>
  <label class="pill" for="bgFile" style="cursor:pointer">Background<input id="bgFile" type="file" accept="image/*" hidden></label>
  <button id="bgClear">Clear</button>
  <button id="resetLayout">Reset layout</button>
</div>

<div id="workspace">
  <section class="win" id="win-timer" style="left:20px;top:20px;width:560px;height:320px">
    <header><span class="name">Speaker timer</span><button class="mini" title="Minimize">&minus;</button><button class="pop" title="Open in its own window">&#8599;</button></header>
    <div class="body">
      <div class="timer">
        <div class="time" id="time">--:--</div>
        <div class="sub" id="tSource">Waiting for the speaker timer</div>
      </div>
    </div>
    <div class="grip"></div>
  </section>

  <section class="win" id="win-arrows" style="left:600px;top:20px;width:420px;height:250px">
    <header><span class="name">Cue lights</span><button class="mini" title="Minimize">&minus;</button><button class="pop" title="Open in its own window">&#8599;</button></header>
    <div class="body">
      <div class="arrows">
        <svg viewBox="0 0 100 100" role="img" aria-label="back cue" id="arrowBack" class="chase-svg back"><g transform="scale(-1,1) translate(-100,0)"><g class="ch1" transform="translate(4,0)"><path d="M0 14 L24 50 L0 86 L14 86 L38 50 L14 14 Z"/></g><g class="ch2" transform="translate(34,0)"><path d="M0 14 L24 50 L0 86 L14 86 L38 50 L14 14 Z"/></g><g class="ch3" transform="translate(64,0)"><path d="M0 14 L24 50 L0 86 L14 86 L38 50 L14 14 Z"/></g></g></svg>
        <svg viewBox="0 0 100 100" role="img" aria-label="next cue" id="arrowNext" class="chase-svg next"><g class="ch1" transform="translate(4,0)"><path d="M0 14 L24 50 L0 86 L14 86 L38 50 L14 14 Z"/></g><g class="ch2" transform="translate(34,0)"><path d="M0 14 L24 50 L0 86 L14 86 L38 50 L14 14 Z"/></g><g class="ch3" transform="translate(64,0)"><path d="M0 14 L24 50 L0 86 L14 86 L38 50 L14 14 Z"/></g></svg>
      </div>
    </div>
    <div class="grip"></div>
  </section>

  <section class="win" id="win-slide" style="left:20px;top:360px;width:270px;height:230px">
    <header><span class="name">Slide</span><button class="mini" title="Minimize">&minus;</button><button class="pop" title="Open in its own window">&#8599;</button></header>
    <div class="body">
      <div class="count" id="slideCount">0</div>
      <div class="row"><button id="minus">Back</button><button id="plus">Forward</button></div>
    </div>
    <div class="grip"></div>
  </section>

  <section class="win" id="win-stats" style="left:310px;top:360px;width:270px;height:230px">
    <header><span class="name">Pace</span><button class="mini" title="Minimize">&minus;</button><button class="pop" title="Open in its own window">&#8599;</button></header>
    <div class="body">
      <div class="stat"><span>On this slide</span><span id="sHold">—</span></div>
      <div class="stat"><span>Cues</span><span id="sTotal">0</span></div>
      <div class="stat"><span>Average</span><span id="sAvg">—</span></div>
      <div class="stat"><span>Longest</span><span id="sMax">—</span></div>
    </div>
    <div class="grip"></div>
  </section>

  <section class="win" id="win-log" style="left:600px;top:290px;width:420px;height:300px">
    <header><span class="name">Cue log</span><button class="mini" title="Minimize">&minus;</button><button class="pop" title="Open in its own window">&#8599;</button></header>
    <div class="body"><div id="log"><div class="empty">Waiting for the first cue.</div></div></div>
    <div class="grip"></div>
  </section>

  <section class="win" id="win-remote" style="left:1040px;top:20px;width:340px;height:300px">
    <header><span class="name">Remote link</span><button class="mini" title="Minimize">&minus;</button></header>
    <div class="body" id="remote">
      <p>Paste your Firebase Realtime Database URL, then start sharing.</p>
      <input id="dbUrl" type="url" placeholder="https://your-project-default-rtdb.firebaseio.com" spellcheck="false">
      <div class="row" style="justify-content:flex-start">
        <button class="primary" id="share">Start sharing</button>
        <button id="copyLink" disabled>Copy link</button>
      </div>
      <p id="shareState">Not sharing.</p>
      <div id="link"></div>
    </div>
    <div class="grip"></div>
  </section>

  <div id="dock"></div>
</div>

<script>
const VID = 0x0483, PID = 0x101a;
const DEBOUNCE_MS = 250;
const params = new URLSearchParams(location.search);
const popoutPanel = params.get('panel');
const channel = new BroadcastChannel('tcg-cue-console');

const state = {
  slide: 0, total: 0, log: [], holds: [], lastCueAt: null,
  connected: false, timerConnected: false, live: null
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const clockOf = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
function duration(ms) { if (ms == null) return '—'; const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : `${Math.floor(s/60)}m ${pad(s%60)}s`; }
function fmtTime(sec) { const a = Math.abs(Math.round(sec)); return `${sec < 0 ? '+' : ''}${Math.floor(a/60)}:${pad(a%60)}`; }

let showKey = null, sharing = false, lastPublish = 0, publishTimer = null;

/* ---------- Pop-out windows ---------- */
if (popoutPanel) {
  document.body.classList.add('popout');
  document.querySelectorAll('.win').forEach(w => { if (w.id !== 'win-' + popoutPanel) w.remove(); });
  channel.addEventListener('message', e => {
    if (!e.data) return;
    if (e.data.type === 'state') { Object.assign(state, e.data.state); render(); }
    else if (e.data.type === 'cue') pulse(e.data.cue);
  });
  channel.postMessage({ type: 'hello' });
}
document.querySelectorAll('.pop').forEach(btn => btn.addEventListener('click', () => {
  const id = btn.closest('.win').id.replace('win-', '');
  window.open(`${location.pathname}?panel=${id}`, `cue-${id}`, 'width=640,height=460');
}));
function broadcast() { if (!popoutPanel) channel.postMessage({ type: 'state', state }); }
channel.addEventListener('message', e => { if (!popoutPanel && e.data && e.data.type === 'hello') broadcast(); });
if (!popoutPanel) setInterval(broadcast, 5000);

/* ---------- Saved settings ---------- */
function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem('cue-console') || '{}');
    if (!popoutPanel && saved.layout) {
      for (const [id, box] of Object.entries(saved.layout)) {
        const el = document.getElementById(id);
        if (!el) continue;
        if (box.left) el.style.left = box.left;
        if (box.top) el.style.top = box.top;
        if (box.width) el.style.width = box.width;
        if (box.height) el.style.height = box.height;
        if (box.min) minimize(el, true);
      }
    }
    if (typeof saved.slide === 'number') state.slide = saved.slide;
    if (saved.dbUrl && $('dbUrl')) $('dbUrl').value = saved.dbUrl;
    if (saved.showKey) showKey = saved.showKey;
    const bg = localStorage.getItem('cue-console-bg');
    if (bg && $('bgLayer')) $('bgLayer').style.backgroundImage = `url(${bg})`;
  } catch {}
}
function save() {
  if (popoutPanel) return;
  try {
    const layout = {};
    document.querySelectorAll('.win').forEach(w => {
      layout[w.id] = { left: w.style.left, top: w.style.top, width: w.style.width, height: w.style.height, min: w.dataset.min === '1' };
    });
    localStorage.setItem('cue-console', JSON.stringify({ layout, slide: state.slide, dbUrl: $('dbUrl') ? $('dbUrl').value.trim() : '', showKey }));
  } catch {}
}

/* ---------- Move, resize, minimize ---------- */
let z = 10;
function minimize(win, restoring) {
  win.dataset.min = '1';
  win.style.display = 'none';
  const btn = document.createElement('button');
  btn.textContent = win.querySelector('.name').textContent;
  btn.addEventListener('click', () => {
    win.style.display = '';
    win.dataset.min = '0';
    win.style.zIndex = ++z;
    btn.remove();
    save();
  });
  $('dock').append(btn);
  if (!restoring) save();
}

if (!popoutPanel) {
  document.querySelectorAll('.win').forEach(win => {
    const head = win.querySelector('header');
    const mini = win.querySelector('.mini');
    if (mini) mini.addEventListener('click', () => minimize(win));
    head.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      const ws = $('workspace').getBoundingClientRect();
      const r = win.getBoundingClientRect();
      const ox = e.clientX - r.left, oy = e.clientY - r.top;
      head.setPointerCapture(e.pointerId);
      win.style.zIndex = ++z;
      head.style.cursor = 'grabbing';
      const move = ev => {
        win.style.left = Math.round(Math.max(0, Math.min(ev.clientX - ws.left - ox, ws.width - 60))) + 'px';
        win.style.top = Math.round(Math.max(0, Math.min(ev.clientY - ws.top - oy, ws.height - 40))) + 'px';
      };
      const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); head.style.cursor = 'grab'; save(); };
      head.addEventListener('pointermove', move);
      head.addEventListener('pointerup', up);
    });
    const grip = win.querySelector('.grip');
    if (grip) grip.addEventListener('pointerdown', e => {
      e.preventDefault();
      const r = win.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      grip.setPointerCapture(e.pointerId);
      win.style.zIndex = ++z;
      const move = ev => {
        win.style.width = Math.max(180, r.width + ev.clientX - sx) + 'px';
        win.style.height = Math.max(120, r.height + ev.clientY - sy) + 'px';
      };
      const up = () => { grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); save(); };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
    });
  });
}

/* ---------- Rendering ---------- */
function renderTimer() {
  const el = $('time');
  if (!el) return;
  const live = state.live;
  const src = $('tSource');
  if (!live) {
    el.textContent = '--:--';
    el.className = 'time';
    if (src) src.textContent = state.timerConnected ? 'Connected, waiting for data' : 'Waiting for the speaker timer';
    return;
  }
  const left = live.total - live.elapsed;
  el.textContent = fmtTime(left);
  el.className = 'time ' + (left <= 0 ? 'red over' : left <= live.yellow ? 'amber' : 'green');
  if (src) src.textContent = `Set ${fmtTime(live.total)} · yellow at ${fmtTime(live.yellow)} · ${live.running ? 'running' : 'stopped'}`;
}

function render() {
  renderTimer();
  if ($('slideCount')) $('slideCount').textContent = state.slide;
  if ($('dot')) {
    $('dot').classList.toggle('on', state.connected);
    $('status').textContent = state.connected ? 'Cues: connected' : 'Cues: not connected';
    $('dotT').classList.toggle('on', !!state.live);
    $('statusT').textContent = state.live ? 'Timer: live' : (state.timerConnected ? 'Timer: waiting for data' : 'Timer: not connected');
  }
  if ($('log')) {
    $('log').innerHTML = state.log.length
      ? state.log.slice(-200).reverse().map(e =>
          `<div><span class="t">${clockOf(e.at)}</span><span class="${e.type}">${e.type === 'next' ? 'Next' : 'Back'}</span>` +
          `<span class="gap">slide ${e.slide}${e.gap != null ? ' · ' + duration(e.gap) : ''}</span></div>`).join('')
      : '<div class="empty">Waiting for the first cue.</div>';
  }
  if ($('sTotal')) {
    $('sTotal').textContent = state.total;
    $('sHold').textContent = state.lastCueAt ? duration(Date.now() - state.lastCueAt) : '—';
    const h = state.holds;
    $('sAvg').textContent = h.length ? duration(h.reduce((a, b) => a + b, 0) / h.length) : '—';
    $('sMax').textContent = h.length ? duration(Math.max(...h)) : '—';
  }
}
setInterval(() => { if ($('sHold')) render(); }, 1000);

function pulse(type) {
  const svg = $(type === 'next' ? 'arrowNext' : 'arrowBack');
  if (!svg) return;
  svg.classList.remove('fire');
  void svg.offsetWidth;
  svg.classList.add('fire');
  clearTimeout(svg._t);
  svg._t = setTimeout(() => svg.classList.remove('fire'), 800);
}

/* ---------- Cues ---------- */
let lastCode = null, lastAt = 0;
function applyCue(type) {
  const now = Date.now();
  const gap = state.lastCueAt ? now - state.lastCueAt : null;
  if (gap != null) state.holds.push(gap);
  state.slide = Math.max(0, state.slide + (type === 'next' ? 1 : -1));
  state.total++;
  state.lastCueAt = now;
  state.log.push({ at: now, type, slide: state.slide, gap });
  if (state.log.length > 400) state.log = state.log.slice(-400);
  pulse(type);
  if ($('dot')) { $('dot').classList.add('flash'); setTimeout(() => $('dot').classList.remove('flash'), 120); }
  if (!popoutPanel) channel.postMessage({ type: 'cue', cue: type });
  render();
  save();
  broadcast();
  publish(true);
}
function onReport(bytes) {
  if (bytes.length < 6) return;
  if (!(bytes[0] === 0x05 && bytes[1] === 0x81 && bytes[2] === 0x0f && bytes[3] === 0x01 && bytes[5] === 0x83)) return;
  const code = bytes[4];
  if (code !== 0 && code !== 1) return;
  const now = Date.now();
  if (code === lastCode && now - lastAt < DEBOUNCE_MS) return;
  lastCode = code; lastAt = now;
  applyCue(code === 0 ? 'next' : 'back');
}

/* ---------- Timer packets ---------- */
let candidate = null, liveSeen = 0;
function onTimerReport(role, bytes) {
  const n = bytes[0];
  if (!n || n > 7) return;
  role.buf = role.buf || [];
  for (let i = 1; i <= n; i++) role.buf.push(bytes[i]);
  let i = 0;
  while (i < role.buf.length - 52) {
    if (role.buf[i] === 0x81 && role.buf[i+1] === 0x00 && role.buf[i+2] === 0x20 && role.buf[i+3] === 0x2f && role.buf[i+51] === 0x83) {
      role.kind = 'timer';
      state.timerConnected = true;
      applyLive(role.buf.slice(i, i + 52));
      i += 52;
    } else i++;
  }
  role.buf = role.buf.slice(i);
  if (role.buf.length > 4096) role.buf = [];
}
function applyLive(b) {
  const live = { total: b[9] * 128 + b[10], yellow: b[12] * 128 + b[13], elapsed: b[15] * 128 + b[16], running: b[6] === 1 };
  if (live.total > 86400 || live.elapsed > 86400 || live.yellow > live.total) return;
  liveSeen = Date.now();
  const key = `${live.total}|${live.yellow}|${live.elapsed}|${live.running}`;
  const cur = state.live;
  const same = cur && cur.total === live.total && cur.yellow === live.yellow && cur.elapsed === live.elapsed && cur.running === live.running;
  if (!same && candidate !== key) { candidate = key; return; }
  candidate = key;
  state.live = live;
  if (!same) { renderTimer(); broadcast(); publish(); }
}
setInterval(() => {
  if (state.live && Date.now() - liveSeen > 5000) { state.live = null; state.timerConnected = false; render(); broadcast(); publish(true); }
}, 1000);

/* ---------- Devices ---------- */
const attached = [], roles = [];
async function attach(d) {
  try { if (!d.opened) await d.open(); } catch { return false; }
  if (attached.includes(d)) return true;
  attached.push(d);
  const role = { device: d, kind: null };
  roles.push(role);
  d.addEventListener('inputreport', e => {
    const bytes = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
    if (role.kind === 'cue') return onReport(bytes);
    if (role.kind === 'timer') return onTimerReport(role, bytes);
    if (bytes[0] === 0x05 && bytes[1] === 0x81 && bytes[2] === 0x0f) {
      role.kind = 'cue'; state.connected = true; render(); return onReport(bytes);
    }
    onTimerReport(role, bytes);
  });
  await sendMode(d, 0x00);
  setTimeout(async () => {
    if (role.kind) return;
    await sendMode(d, 0x01);
    role.kind = 'cue';
    state.connected = true;
    render(); broadcast();
  }, 2500);
  render(); broadcast();
  return true;
}
async function sendMode(d, mode) {
  const cmd = new Uint8Array(64);
  cmd[0] = 0x8d; cmd[1] = mode;
  try { await d.sendReport(0, cmd); return true; } catch { return false; }
}

/* ---------- Remote sharing ---------- */
function dbBase() {
  const el = $('dbUrl');
  const raw = el ? (el.value || '').trim().replace(/\/+$/, '') : '';
  return raw || null;
}
function viewerLink() {
  const base = location.origin + location.pathname.replace(/index\.html$/, '');
  return `${base}view.html?db=${encodeURIComponent(dbBase())}&k=${showKey}`;
}
function publish(force) {
  if (!sharing || !showKey || popoutPanel) return;
  const now = Date.now();
  if (!force && now - lastPublish < 700) {
    clearTimeout(publishTimer);
    publishTimer = setTimeout(() => publish(true), 700);
    return;
  }
  lastPublish = now;
  const payload = {
    live: state.live,
    slide: state.slide,
    lastCue: state.log.length ? state.log[state.log.length - 1] : null,
    connected: state.connected,
    at: now
  };
  fetch(`${dbBase()}/shows/${showKey}.json`, { method: 'PUT', body: JSON.stringify(payload) })
    .then(r => { $('shareState').textContent = r.ok ? `Sharing · updated ${clockOf(Date.now())}` : `Share error ${r.status}`; })
    .catch(() => { $('shareState').textContent = 'Share failed — check the database URL and rules.'; });
}

/* ---------- Wiring ---------- */
if (!popoutPanel) {
  $('share').addEventListener('click', () => {
    if (!dbBase()) { $('shareState').textContent = 'Enter the database URL first.'; return; }
    if (sharing) {
      sharing = false;
      $('share').textContent = 'Start sharing';
      $('shareState').textContent = 'Not sharing.';
      return;
    }
    if (!showKey) showKey = Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
    sharing = true;
    $('share').textContent = 'Stop sharing';
    $('copyLink').disabled = false;
    $('link').innerHTML = `<a href="${viewerLink()}" target="_blank" rel="noopener">${viewerLink()}</a>`;
    save();
    publish(true);
  });
  $('copyLink').addEventListener('click', () => {
    navigator.clipboard.writeText(viewerLink()).then(() => { $('shareState').textContent = 'Link copied.'; });
  });
  setInterval(() => publish(), 2000);

  $('bgFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 2200 / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL('image/jpeg', 0.82);
        $('bgLayer').style.backgroundImage = `url(${data})`;
        try { localStorage.setItem('cue-console-bg', data); } catch {}
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  $('bgClear').addEventListener('click', () => {
    $('bgLayer').style.backgroundImage = '';
    try { localStorage.removeItem('cue-console-bg'); } catch {}
  });
  $('resetLayout').addEventListener('click', () => {
    try {
      const raw = JSON.parse(localStorage.getItem('cue-console') || '{}');
      delete raw.layout;
      localStorage.setItem('cue-console', JSON.stringify(raw));
    } catch {}
    location.reload();
  });
  $('reset').addEventListener('click', () => {
    state.slide = 0; state.total = 0; state.log = []; state.holds = []; state.lastCueAt = null;
    render(); save(); broadcast(); publish(true);
  });
  $('plus').addEventListener('click', () => applyCue('next'));
  $('minus').addEventListener('click', () => applyCue('back'));
  $('arrowNext').addEventListener('click', () => applyCue('next'));
  $('arrowBack').addEventListener('click', () => applyCue('back'));
}

if (!popoutPanel && 'hid' in navigator) {
  $('connect').addEventListener('click', async () => {
    let list = [];
    try { list = await navigator.hid.requestDevice({ filters: [{ vendorId: VID, productId: PID }] }); } catch {}
    for (const d of list) await attach(d);
  });
  navigator.hid.getDevices().then(async devices => {
    for (const d of devices.filter(x => x.vendorId === VID && x.productId === PID)) await attach(d);
  }).catch(() => {});
  navigator.hid.addEventListener('disconnect', e => {
    const i = attached.indexOf(e.device);
    if (i >= 0) attached.splice(i, 1);
    const r = roles.findIndex(x => x.device === e.device);
    if (r >= 0) {
      if (roles[r].kind === 'cue') state.connected = false;
      if (roles[r].kind === 'timer') { state.timerConnected = false; state.live = null; }
      roles.splice(r, 1);
    }
    render(); broadcast(); publish(true);
  });
} else if (!popoutPanel) {
  $('status').textContent = 'This browser cannot read the hardware. Use Chrome or Edge.';
  $('connect').disabled = true;
}

loadSaved();
render();
</script>
</body>
</html>
