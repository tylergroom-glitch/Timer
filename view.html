<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#10151C;--text:#DCE2E8;--dim:#8C98A5;--green:#3FB950;--amber:#E3B341;--red:#F85149;--line:#2C3542}
*{box-sizing:border-box}
#bgLayer{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-1}
body.laid-out{display:block;padding:0}
body.laid-out #tod,body.laid-out #time,body.laid-out .arrows,
body.laid-out #slide,body.laid-out #msg,body.laid-out #ros{
  position:absolute;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
body.laid-out #sub{display:none}
body.laid-out .arrows{gap:4%}
body.clear{background:transparent}
body.clear #bgLayer{display:none}
body.clear #time,body.clear .cue-arrow,body.clear #slide,body.clear #sub{filter:drop-shadow(0 2px 7px rgba(0,0,0,.6))}
body.hide-arrows .arrows,body.hide-arrows #slide{display:none}
body.hide-timer #time,body.hide-timer #sub{display:none}
body.hide-slide #slide{display:none}
body.hide-state #state{display:none}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:4vmin;text-align:center}
#time{font-weight:500;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;font-size:min(30vh,22vw)}
#time.green{color:var(--green)}
#time.amber{color:var(--amber)}
#time.red{color:var(--red)}
#time.over{animation:blink 1s steps(2,end) infinite}
body.flashing #time{animation:zeroFlash 1s steps(1,end) infinite}
@keyframes zeroFlash{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes blink{50%{opacity:.35}}
#sub{color:var(--dim);font-size:clamp(13px,2.2vh,17px)}
#tod{display:none;font-variant-numeric:tabular-nums;font-weight:500;color:var(--text);
  font-size:clamp(18px,7vh,64px);line-height:1}
body.show-tod #tod{display:block}
body.hide-timer #time,body.hide-timer #sub{display:none}
.arrows{display:flex;gap:6vw;align-items:center;justify-content:center;width:min(76vw,620px)}
.arrows svg{width:44%}
.arrows.stacked{flex-direction:column;gap:0;justify-content:center;align-items:center}
.arrows.stacked svg{width:min(52vw,400px);height:auto}
.arrows.stacked .style-bulbs{width:min(58vw,440px)}
.arrows.stacked .style-bulbs.back{margin-top:-14%}
.arrows.stacked .style-classic{width:min(58vw,440px)}
.arrows.stacked .style-classic.back{margin-top:-28%}
.arrows.stacked .style-chase.back{margin-top:-14%}
.arrows.stacked .style-star.back,.arrows.stacked .style-pointer.back{margin-top:-4%}
.arrows.stacked .cue-arrow.next{transform:translate(3%,-4%)}
.arrows.stacked .cue-arrow.back{transform:translate(5%,0)}

.cue-arrow polygon,.cue-arrow path,.cue-arrow circle{opacity:.4}
.cue-arrow.next polygon,.cue-arrow.next path,.cue-arrow.next circle{fill:var(--green)}
.cue-arrow.back polygon,.cue-arrow.back path,.cue-arrow.back circle{fill:var(--red)}
.cue-arrow text{opacity:.45;font-size:66px}

/* classic: solid triangle, light sweeps left to right */
.cue-arrow.style-classic.fire .shape{
  -webkit-mask-image:linear-gradient(90deg,#000 0 48%,transparent 78%);
  mask-image:linear-gradient(90deg,#000 0 48%,transparent 78%);
  -webkit-mask-size:230% 100%;mask-size:230% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:lightUp .75s ease-out}
@keyframes lightUp{
  0%{opacity:1;-webkit-mask-position:100% 0;mask-position:100% 0}
  50%{opacity:1;-webkit-mask-position:0% 0;mask-position:0% 0}
  78%{opacity:1;-webkit-mask-position:0% 0;mask-position:0% 0}
  100%{opacity:.4;-webkit-mask-position:0% 0;mask-position:0% 0}}

/* chase: three chevrons in sequence */
.cue-arrow.style-chase path{opacity:.45}
.cue-arrow.style-chase.fire .ch1{animation:flare .8s ease-out 0s}
.cue-arrow.style-chase.fire .ch2{animation:flare .8s ease-out .12s}
.cue-arrow.style-chase.fire .ch3{animation:flare .8s ease-out .24s}
@keyframes flare{0%{opacity:.45}12%{opacity:1}65%{opacity:1}100%{opacity:.45}}

/* bulbs: lamp array that lights column by column */
.cue-arrow.style-bulbs circle{opacity:.3}
.cue-arrow.style-bulbs .gloss{fill:#fff !important;opacity:.13}
.cue-arrow.style-bulbs.fire .gloss{animation:gloss .85s ease-out}
@keyframes gloss{0%{opacity:.13}10%{opacity:.5}65%{opacity:.45}100%{opacity:.13}}
.cue-arrow.style-bulbs.fire .b1 circle{animation:lamp .9s ease-out 0.000s}
.cue-arrow.style-bulbs.fire .b2 circle{animation:lamp .9s ease-out 0.055s}
.cue-arrow.style-bulbs.fire .b3 circle{animation:lamp .9s ease-out 0.110s}
.cue-arrow.style-bulbs.fire .b4 circle{animation:lamp .9s ease-out 0.165s}
.cue-arrow.style-bulbs.fire .b5 circle{animation:lamp .9s ease-out 0.220s}
.cue-arrow.style-bulbs.fire .b6 circle{animation:lamp .9s ease-out 0.275s}
.cue-arrow.style-bulbs.fire .b7 circle{animation:lamp .9s ease-out 0.330s}
@keyframes lamp{0%{opacity:.3}10%{opacity:1}65%{opacity:1}100%{opacity:.3}}

/* star: pops and spins */
.cue-arrow.style-star .shape{transform-box:fill-box;transform-origin:center}
.cue-arrow.style-star.fire .shape{animation:starPop .75s cubic-bezier(.2,1.4,.4,1)}
@keyframes starPop{0%{opacity:.4;transform:scale(.55) rotate(-35deg)}
  45%{opacity:1;transform:scale(1.12) rotate(8deg)}
  70%{opacity:1;transform:scale(1) rotate(0)}
  100%{opacity:.4;transform:scale(1) rotate(0)}}

/* pointer: a finger that jabs */
.cue-arrow.style-pointer .shape{transform-box:fill-box;transform-origin:center}
.cue-arrow.style-pointer.fire .shape{animation:jab .75s ease-out}
@keyframes jab{0%{opacity:.45;transform:translateX(-14px) scale(.9)}
  35%{opacity:1;transform:translateX(10px) scale(1.12)}
  65%{opacity:1;transform:translateX(0) scale(1)}
  100%{opacity:.45;transform:translateX(0) scale(1)}}

#slide{font-size:clamp(14px,2.4vh,19px);color:var(--dim)}
#slide b{color:var(--text);font-weight:500}
#msg{display:none;color:var(--amber);font-weight:500;text-align:center;line-height:1.2;
  font-size:clamp(20px,5vh,54px);padding:0 4vw;margin-top:1vh}
#msg.on{display:block}
#ros{color:var(--dim);font-size:clamp(12px,2.2vh,18px);margin-top:.5vh}
#ros b{color:var(--text);font-weight:500}
body.hide-extras #msg,body.hide-extras #ros{display:none}
#state{position:fixed;top:10px;right:14px;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="state">connecting…</div>
<div id="tod"></div>
<div id="time">--:--</div>
<div id="sub"></div>
<div class="arrows">
  <svg viewBox="0 0 100 100" role="img" aria-label="Back cue" id="aBack" class="cue-arrow back style-classic"></svg>
  <svg viewBox="0 0 100 100" role="img" aria-label="Next cue" id="aNext" class="cue-arrow next style-classic"></svg>
</div>
<div id="slide">Slide <b id="slideNum">0</b></div>
<div id="msg"></div>
<div id="ros"></div>

<script>
const q = new URLSearchParams(location.search);
const db = (q.get('db') || 'https://dsan-f12e2-default-rtdb.firebaseio.com').replace(/\/+$/, '');
const key = q.get('k');
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = s => `${s < 0 ? '+' : ''}${Math.floor(Math.abs(Math.round(s))/60)}:${pad(Math.abs(Math.round(s))%60)}`;
const flag = (name, def) => { const v = q.get(name); return v === null ? def : !(v === '0' || v === 'false' || v === 'no'); };
if (flag('clear', false)) document.body.classList.add('clear');
if (!flag('arrows', true)) document.body.classList.add('hide-arrows');
if (!flag('timer', true)) document.body.classList.add('hide-timer');
if (!flag('slide', true)) document.body.classList.add('hide-slide');
if (!flag('status', true)) document.body.classList.add('hide-state');
if (!flag('extras', true)) document.body.classList.add('hide-extras');
const showDetail = flag('detail', false);
if (flag('tod', false)) {
  document.body.classList.add('show-tod');
  const todEl = document.getElementById('tod');
  const tick = () => {
    const d = new Date();
    let h = d.getHours();
    const suffix = h < 12 ? ' AM' : ' PM';
    h = h % 12 || 12;
    todEl.textContent = `${h}:${pad(d.getMinutes())}${suffix}`;
  };
  tick();
  setInterval(tick, 1000);
}
if (!db || !key) {
  $('state').textContent = 'bad link';
  $('sub').textContent = 'This link is missing its show details.';
} else {
  start();
}

let lastCueAt = 0;
let appliedLayout = null;

function applyRemoteLayout(layout) {
  if (!layout) return;
  appliedLayout = layout;
  document.body.classList.add('laid-out');
  const map = { tod: '#tod', timer: '#time', arrows: '.arrows', nownext: '#ros', message: '#msg', slide: '#slide' };
  for (const [k, sel] of Object.entries(map)) {
    const el = document.querySelector(sel);
    const b = layout[k];
    if (!el) continue;
    if (!b || !b.on) { el.style.display = 'none'; continue; }
    el.style.display = 'flex';
    el.style.left = b.x + '%';
    el.style.top = b.y + '%';
    el.style.width = b.w + '%';
    el.style.height = b.h + '%';
  }
  sizeText();
}

// scale type to the box it sits in
function sizeText() {
  if (!appliedLayout) return;
  const h = window.innerHeight;
  const set = (sel, k, factor) => {
    const el = document.querySelector(sel);
    const b = appliedLayout[k];
    if (!el || !b || !b.on) return;
    el.style.fontSize = Math.max(10, (b.h / 100) * h * factor) + 'px';
  };
  set('#time', 'timer', 0.82);
  set('#tod', 'tod', 0.7);
  set('#msg', 'message', 0.5);
  set('#ros', 'nownext', 0.55);
  set('#slide', 'slide', 0.5);
}
window.addEventListener('resize', sizeText);
let shownStyle = null;
let shownStacked = false;
const arrowIdPrefix = 'a';
const ARROW_STYLES = {
  classic: '<polygon class="shape" points="8,10 8,90 94,50"/>',
  chase: ['<g class="ch1" transform="translate(0,0)"><path d="M0 12 L28 50 L0 88 L20 88 L48 50 L20 12 Z"/></g>',
          '<g class="ch2" transform="translate(25,0)"><path d="M0 12 L28 50 L0 88 L20 88 L48 50 L20 12 Z"/></g>',
          '<g class="ch3" transform="translate(50,0)"><path d="M0 12 L28 50 L0 88 L20 88 L48 50 L20 12 Z"/></g>'].join(''),
  star: '<polygon class="shape" points="50,5 61,37 95,37 67,57 78,92 50,71 22,92 33,57 5,37 39,37"/>',
  pointer: '<text class="shape" x="50" y="52" text-anchor="middle" dominant-baseline="central">\u{1F449}</text>',
  bulbs: '<g class="b1"><circle cx="8" cy="9.2" r="6.4"/><circle class="gloss" cx="6.2" cy="7.2" r="2.1"/><circle cx="8" cy="22.8" r="6.4"/><circle class="gloss" cx="6.2" cy="20.8" r="2.1"/><circle cx="8" cy="36.4" r="6.4"/><circle class="gloss" cx="6.2" cy="34.4" r="2.1"/><circle cx="8" cy="50.0" r="6.4"/><circle class="gloss" cx="6.2" cy="48.0" r="2.1"/><circle cx="8" cy="63.6" r="6.4"/><circle class="gloss" cx="6.2" cy="61.6" r="2.1"/><circle cx="8" cy="77.2" r="6.4"/><circle class="gloss" cx="6.2" cy="75.2" r="2.1"/><circle cx="8" cy="90.8" r="6.4"/><circle class="gloss" cx="6.2" cy="88.8" r="2.1"/></g><g class="b2"><circle cx="22" cy="16.0" r="6.4"/><circle class="gloss" cx="20.2" cy="14.0" r="2.1"/><circle cx="22" cy="29.6" r="6.4"/><circle class="gloss" cx="20.2" cy="27.6" r="2.1"/><circle cx="22" cy="43.2" r="6.4"/><circle class="gloss" cx="20.2" cy="41.2" r="2.1"/><circle cx="22" cy="56.8" r="6.4"/><circle class="gloss" cx="20.2" cy="54.8" r="2.1"/><circle cx="22" cy="70.4" r="6.4"/><circle class="gloss" cx="20.2" cy="68.4" r="2.1"/><circle cx="22" cy="84.0" r="6.4"/><circle class="gloss" cx="20.2" cy="82.0" r="2.1"/></g><g class="b3"><circle cx="36" cy="22.8" r="6.4"/><circle class="gloss" cx="34.2" cy="20.8" r="2.1"/><circle cx="36" cy="36.4" r="6.4"/><circle class="gloss" cx="34.2" cy="34.4" r="2.1"/><circle cx="36" cy="50.0" r="6.4"/><circle class="gloss" cx="34.2" cy="48.0" r="2.1"/><circle cx="36" cy="63.6" r="6.4"/><circle class="gloss" cx="34.2" cy="61.6" r="2.1"/><circle cx="36" cy="77.2" r="6.4"/><circle class="gloss" cx="34.2" cy="75.2" r="2.1"/></g><g class="b4"><circle cx="50" cy="29.6" r="6.4"/><circle class="gloss" cx="48.2" cy="27.6" r="2.1"/><circle cx="50" cy="43.2" r="6.4"/><circle class="gloss" cx="48.2" cy="41.2" r="2.1"/><circle cx="50" cy="56.8" r="6.4"/><circle class="gloss" cx="48.2" cy="54.8" r="2.1"/><circle cx="50" cy="70.4" r="6.4"/><circle class="gloss" cx="48.2" cy="68.4" r="2.1"/></g><g class="b5"><circle cx="64" cy="36.4" r="6.4"/><circle class="gloss" cx="62.2" cy="34.4" r="2.1"/><circle cx="64" cy="50.0" r="6.4"/><circle class="gloss" cx="62.2" cy="48.0" r="2.1"/><circle cx="64" cy="63.6" r="6.4"/><circle class="gloss" cx="62.2" cy="61.6" r="2.1"/></g><g class="b6"><circle cx="78" cy="43.2" r="6.4"/><circle class="gloss" cx="76.2" cy="41.2" r="2.1"/><circle cx="78" cy="56.8" r="6.4"/><circle class="gloss" cx="76.2" cy="54.8" r="2.1"/></g><g class="b7"><circle cx="92" cy="50.0" r="6.4"/><circle class="gloss" cx="90.2" cy="48.0" r="2.1"/></g>'
};
const ARROW_BOXES = { classic: '8 10 86 80', chase: '0 12 98 76', bulbs: '1 2 98 96', star: '4 4 92 90', pointer: '0 0 100 100' };
const ARROW_NAMES = { classic: 'Classic', chase: 'Chase', star: 'Stars', pointer: 'Finger', bulbs: 'Bulbs' };
function applyLayout(on) {
  document.querySelectorAll('.arrows').forEach(row => {
    row.classList.toggle('stacked', !!on);
    const next = row.querySelector('.cue-arrow.next');
    const back = row.querySelector('.cue-arrow.back');
    if (!next || !back) return;
    if (on) row.prepend(next); else row.prepend(back);
  });
}

function paintArrows(style) {
  const s = ARROW_STYLES[style] ? style : 'classic';
  document.querySelectorAll('.cue-arrow').forEach(svg => {
    const dir = svg.classList.contains('back') ? 'back' : 'next';
    const inner = ARROW_STYLES[s];
    svg.innerHTML = dir === 'back'
      ? `<g transform="scale(-1,1) translate(-100,0)">${inner}</g>`
      : inner;
    svg.setAttribute('class', `cue-arrow ${dir} style-${s}`);
    svg.setAttribute('viewBox', ARROW_BOXES[s] || '0 0 100 100');
  });
}
paintArrows('classic');

function paint(d) {
  if (!d) return;
  const live = d.live;
  if (live) {
    let left = live.total - live.elapsed;
    const over = left < 0;
    if (d.stopAtZero && over) left = 0;
    $('time').textContent = fmt(left);
    $('time').className = left <= 0 ? (over && !d.stopAtZero ? 'red over' : 'red') : left <= live.yellow ? 'amber' : 'green';
    document.body.classList.toggle('flashing', left <= 0 && !!d.flashAtZero);
    $('sub').textContent = showDetail
      ? `${live.program ? 'Program ' + live.program + ' · ' : ''}Set ${fmt(live.total)} · ${live.running ? 'running' : 'stopped'}${live.blink ? ' · BLINK' : ''}${live.beep ? ' · BEEP' : ''}`
      : '';
  } else {
    $('time').textContent = '--:--';
    $('time').className = '';
    document.body.classList.remove('flashing');
    $('sub').textContent = showDetail ? 'Timer not running' : '';
  }
  if (d.arrowStyle && d.arrowStyle !== shownStyle) { shownStyle = d.arrowStyle; paintArrows(d.arrowStyle); }
  if (typeof d.arrowStacked === 'boolean' && d.arrowStacked !== shownStacked) { shownStacked = d.arrowStacked; applyLayout(d.arrowStacked); }
  if (d.layout) applyRemoteLayout(d.layout);
  $('slideNum').textContent = d.slide != null ? d.slide : 0;

  const msg = $('msg');
  if (msg) {
    msg.textContent = d.message || '';
    msg.classList.toggle('on', !!d.message);
  }
  const ros = $('ros');
  if (ros) {
    if (d.ros && d.ros.now) {
      const diff = d.ros.diff || 0;
      const label = Math.abs(diff) < 30 ? 'on time' : (diff > 0 ? 'behind' : 'ahead');
      const mins = Math.floor(Math.abs(diff) / 60) + ':' + pad(Math.abs(diff) % 60);
      ros.innerHTML = `Now: <b>${d.ros.now}</b>` + (d.ros.next ? ` · next: ${d.ros.next}` : '') +
        ` · ${label === 'on time' ? 'on time' : mins + ' ' + label}`;
    } else ros.innerHTML = '';
  }
  if (d.lastCue && d.lastCue.at && d.lastCue.at !== lastCueAt) {
    lastCueAt = d.lastCue.at;
    if (Date.now() - d.lastCue.at < 8000) flash(d.lastCue.type);
  }
}

function flash(type) {
  document.querySelectorAll('.cue-arrow.' + type).forEach(el => {
    el.classList.remove('fire');
    void el.offsetWidth;
    el.classList.add('fire');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('fire'), 1600);
  });
}

function loadBackground() {
  fetch(`${db}/shows/${key}/bg.json`, { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      const layer = document.getElementById('bgLayer');
      if (!d) { layer.style.backgroundImage = ''; layer.style.backgroundColor = ''; return; }
      if (typeof d === 'string') { layer.style.backgroundColor = ''; layer.style.backgroundImage = `url(${d})`; return; }
      if (d.type === 'color') { layer.style.backgroundImage = ''; layer.style.backgroundColor = d.value; }
      else { layer.style.backgroundColor = ''; layer.style.backgroundImage = `url(${d.value})`; }
    })
    .catch(() => {});
}

function start() {
  loadBackground();
  setInterval(loadBackground, 30000);
  const url = `${db}/shows/${key}/state.json`;
  let es;
  try {
    es = new EventSource(url);
    es.addEventListener('put', e => {
      $('state').textContent = 'live';
      try {
        const msg = JSON.parse(e.data);
        if (msg.path === '/') paint(msg.data);
        else poll();
      } catch {}
    });
    es.addEventListener('patch', () => poll());
    es.onerror = () => { $('state').textContent = 'reconnecting…'; };
  } catch {
    setInterval(poll, 1000);
  }
  poll();
  setInterval(() => { if ($('state').textContent !== 'live') poll(); }, 3000);
}

function poll() {
  fetch(`${db}/shows/${key}/state.json`, { cache: 'no-store' })
    .then(r => r.json())
    .then(d => { $('state').textContent = 'live'; paint(d); })
    .catch(() => { $('state').textContent = 'offline'; });
}
</script>
</body>
</html>
