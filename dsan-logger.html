<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSAN data logger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10151C; --panel:#1B222C; --well:#131920; --line:#2C3542;
  --text:#DCE2E8; --dim:#8C98A5;
  --green:#3FB950; --amber:#E3B341; --red:#F85149; --blue:#6CB6FF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:#263040;border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{background:#2F3B4E}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#1F4E8C;border-color:#2B63AD}
button.primary:hover{background:#2660A8}
select,input{background:var(--well);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{padding:18px 24px 14px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;font-weight:600}
header p{margin:4px 0 0;color:var(--dim);max-width:70ch}
.banner{margin:14px 24px 0;padding:12px 16px;border:1px solid var(--red);border-radius:8px;background:#2A1A1C;display:none}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
.toolbar .marker{display:flex;gap:8px;flex:1 1 320px}
.toolbar .marker input{flex:1}
.toolbar label{color:var(--dim);display:flex;gap:6px;align-items:center}
.toolbar input[type=number]{width:70px}
#pauseNote{color:var(--amber);display:none}

main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 24px 24px}
@media (max-width:980px){main{grid-template-columns:1fr}}

.device{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:70vh}
.dev-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dev-head h2{margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px;margin-right:auto}
.led{width:12px;height:12px;border-radius:50%;background:#46505C;box-shadow:inset 0 0 0 1px #0006}
.led.live{background:var(--green)}
.led.error{background:var(--red)}
.led.blink{background:#9BF0A8}
.status{width:100%;color:var(--dim);font-size:14px}
.stats{display:flex;gap:22px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--dim)}
.stats b{display:block;color:var(--text);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}

.list{flex:1;overflow-y:auto;max-height:70vh;padding:6px 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px}
.empty{padding:28px 16px;color:var(--dim);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px}
.row{display:grid;grid-template-columns:96px 52px 1fr;gap:10px;padding:5px 16px;border-bottom:1px solid #222A35}
.row .t{color:var(--dim)}
.row .len{color:var(--dim)}
.row .hex{word-break:break-word}
.row .hex b{font-weight:500;color:var(--amber)}
.row .ascii{grid-column:3;color:#6F7B88}
.row .rep{color:var(--blue);margin-left:8px}
.row.note{color:var(--red);font-family:"IBM Plex Sans",system-ui,sans-serif}
.row.mark{background:#1D2A3D;color:var(--blue);font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:500}
</style>
</head>
<body>

<header>
  <h1>DSAN data logger</h1>
  <p>Plug the Limitimer and PerfectCue into the VC-2000, connect its port below, work the devices while adding markers, then save the log. This page only listens; it never sends anything to the Limitimer or PerfectCue.</p>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <div class="marker">
    <input id="markerText" type="text" placeholder="Describe what you're about to do, e.g. Pressed start on 5:00" aria-label="Marker text">
    <button id="markerBtn">Add marker</button>
  </div>
  <label>Frame gap <input id="gap" type="number" min="5" max="500" value="30"> ms</label>
  <button id="pauseBtn">Pause display</button>
  <span id="pauseNote">Display paused, still recording</span>
  <button id="clearBtn">Clear</button>
  <button id="saveBtn" class="primary">Save log</button>
</div>

<main>
  <section class="device" id="dev-limitimer"></section>
  <section class="device" id="dev-perfectcue"></section>
</main>

<script>
const MAX_ROWS = 400;
const MAX_LOG = 50000;
const log = [];
let paused = false;

const devices = [
  makeDevice('limitimer', 'Limitimer', 'LT-Ser-USB'),
  makeDevice('perfectcue', 'PerfectCue', 'PC-Ser-USB')
];

function makeDevice(id, name, cable) {
  const root = document.getElementById('dev-' + id);
  root.innerHTML = `
    <div class="dev-head">
      <h2><span class="led"></span>${name}</h2>
      <select class="baud" aria-label="${name} baud rate">
        <option>9600</option><option selected>19200</option><option>38400</option><option>57600</option><option>115200</option>
      </select>
      <select class="parity" aria-label="${name} parity">
        <option value="none" selected>No parity</option><option value="even">Even parity</option><option value="odd">Odd parity</option>
      </select>
      <button class="primary connect">Connect</button>
      <button class="disconnect" disabled>Disconnect</button>
      <div class="status">Not connected. Plug the ${name} into the VC-2000, click Connect, and pick the VC-2000 port.</div>
    </div>
    <div class="stats">
      <div>Bytes<b class="s-bytes">0</b></div>
      <div>Bytes/sec<b class="s-rate">0</b></div>
      <div>Frames<b class="s-frames">0</b></div>
      <div>Unique frames<b class="s-unique">0</b></div>
    </div>
    <div class="list"><div class="empty">No data yet.</div></div>`;
  const q = s => root.querySelector(s);
  const dev = {
    id, name, cable, port: null, reader: null, loop: null, keepReading: false,
    buf: [], lastByteAt: 0, flushTimer: null, lastFrame: null, lastRow: null, repeat: 1,
    bytes: 0, bytesAtLastTick: 0, frames: 0, unique: new Set(), errorSeen: {},
    el: { led: q('.led'), baud: q('.baud'), parity: q('.parity'), connect: q('.connect'),
          disconnect: q('.disconnect'), status: q('.status'), list: q('.list'),
          bytes: q('.s-bytes'), rate: q('.s-rate'), frames: q('.s-frames'), unique: q('.s-unique') }
  };
  dev.el.connect.addEventListener('click', () => connect(dev));
  dev.el.disconnect.addEventListener('click', () => disconnect(dev));
  return dev;
}

/* ---------- Browser check ---------- */
const banner = document.getElementById('banner');
if (!('serial' in navigator)) {
  banner.style.display = 'block';
  banner.textContent = window.isSecureContext
    ? 'This browser can\'t read USB serial cables. Open this file in Google Chrome or Microsoft Edge on your Mac (Safari and Firefox don\'t support it).'
    : 'The browser blocked USB access because of how this page was opened. Open it from an https:// address (for example your Firebase Hosting site).';
  devices.forEach(d => d.el.connect.disabled = true);
}

/* ---------- Connection ---------- */
async function connect(dev) {
  let port;
  try {
    port = await navigator.serial.requestPort();
  } catch (e) {
    if (e.name !== 'NotFoundError') setStatus(dev, 'error', 'Could not open the port chooser: ' + e.message);
    return;
  }
  const baudRate = Number(dev.el.baud.value);
  const parity = dev.el.parity.value;
  try {
    await port.open({ baudRate, dataBits: 8, stopBits: 1, parity, bufferSize: 8192 });
  } catch (e) {
    const msg = e.name === 'InvalidStateError'
      ? 'That port is already connected in the other panel. If the VC-2000 only shows one port, it may carry both devices; use just one panel.'
      : 'Could not open that port: ' + e.message;
    setStatus(dev, 'error', msg);
    return;
  }
  dev.port = port;
  dev.keepReading = true;
  dev.errorSeen = {};
  setStatus(dev, 'live', `Listening at ${baudRate} baud, 8 data bits, ${parity} parity, 1 stop bit.`);
  setControls(dev, true);
  const info = port.getInfo();
  const usbId = info.usbVendorId ? ` (USB ID ${info.usbVendorId.toString(16).padStart(4,'0')}:${(info.usbProductId||0).toString(16).padStart(4,'0')})` : '';
  addNote(dev, `Connected at ${baudRate} baud, ${parity} parity${usbId}`, 'mark');

  dev.loop = readLoop(dev).then(async () => {
    if (dev.keepReading) {
      dev.keepReading = false;
      try { await port.close(); } catch {}
      dev.port = null;
      setStatus(dev, 'error', 'VC-2000 disconnected. Plug it back in and click Connect.');
      setControls(dev, false);
      addNote(dev, 'VC-2000 disconnected');
    }
  });
}

async function disconnect(dev) {
  if (!dev.port) return;
  dev.keepReading = false;
  try { if (dev.reader) await dev.reader.cancel(); } catch {}
  if (dev.loop) await dev.loop;
  try { await dev.port.close(); } catch {}
  dev.port = null;
  setStatus(dev, 'off', 'Disconnected.');
  setControls(dev, false);
  addNote(dev, 'Disconnected', 'mark');
}

async function readLoop(dev) {
  const port = dev.port;
  while (port.readable && dev.keepReading) {
    const reader = port.readable.getReader();
    dev.reader = reader;
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value && value.length) onBytes(dev, value);
      }
    } catch (e) {
      if (dev.keepReading) reportError(dev, e.name);
    } finally {
      reader.releaseLock();
      dev.reader = null;
    }
  }
  flush(dev);
}

const ERROR_HINTS = {
  FramingError: 'bytes arrived out of shape; the baud rate may be wrong',
  ParityError: 'the parity setting may be wrong',
  BreakError: 'line break detected; some RS-485 buses do this normally',
  BufferOverrunError: 'data arrived faster than the page could read it',
  NetworkError: 'the VC-2000 was unplugged'
};
function reportError(dev, name) {
  const now = Date.now();
  const seen = dev.errorSeen[name] || { last: 0, count: 0 };
  seen.count++;
  if (now - seen.last > 2000) {
    const extra = seen.count > 1 ? ` (${seen.count} times)` : '';
    addNote(dev, `${name}${extra}: ${ERROR_HINTS[name] || 'unexpected read error'}`);
    seen.last = now;
    seen.count = 0;
  }
  dev.errorSeen[name] = seen;
}

/* ---------- Framing ---------- */
function gapMs() { return Math.max(5, Number(document.getElementById('gap').value) || 30); }

function onBytes(dev, chunk) {
  const now = performance.now();
  if (dev.buf.length && now - dev.lastByteAt > gapMs()) flush(dev);
  for (const b of chunk) dev.buf.push(b);
  dev.bytes += chunk.length;
  dev.lastByteAt = now;
  clearTimeout(dev.flushTimer);
  dev.flushTimer = setTimeout(() => flush(dev), gapMs());
  if (dev.buf.length >= 1024) flush(dev);
}

function flush(dev) {
  clearTimeout(dev.flushTimer);
  if (!dev.buf.length) return;
  const bytes = Uint8Array.from(dev.buf);
  dev.buf = [];
  dev.frames++;
  const key = toHex(bytes);
  if (dev.unique.size < 10000) dev.unique.add(key);
  const prev = dev.lastFrame;
  dev.lastFrame = bytes;
  pushLog({ time: new Date(), dev: dev.id, kind: 'frame', bytes });
  blink(dev);

  if (prev && sameBytes(prev, bytes) && dev.lastRow) {
    dev.repeat++;
    if (!paused) {
      let rep = dev.lastRow.querySelector('.rep');
      if (!rep) { rep = document.createElement('span'); rep.className = 'rep'; dev.lastRow.querySelector('.hex').append(rep); }
      rep.textContent = `repeated ${dev.repeat}x`;
    }
    return;
  }
  dev.repeat = 1;
  if (!paused) dev.lastRow = renderFrame(dev, bytes, prev);
}

/* ---------- Rendering ---------- */
function renderFrame(dev, bytes, prev) {
  const row = document.createElement('div');
  row.className = 'row';
  const compare = prev && prev.length === bytes.length;
  const hex = Array.from(bytes, (b, i) => {
    const h = b.toString(16).toUpperCase().padStart(2, '0');
    return compare && prev[i] !== b ? `<b>${h}</b>` : h;
  }).join(' ');
  const ascii = Array.from(bytes, b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join('');
  row.innerHTML = `<span class="t">${clock(new Date())}</span><span class="len">${bytes.length}B</span>`
    + `<span class="hex">${hex}</span><span class="ascii">${escapeHtml(ascii)}</span>`;
  prepend(dev, row);
  return row;
}

function addNote(dev, text, kind = 'note') {
  pushLog({ time: new Date(), dev: dev.id, kind, text });
  if (paused) return;
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  row.innerHTML = `<span class="t">${clock(new Date())}</span><span></span><span>${escapeHtml(text)}</span>`;
  prepend(dev, row);
  dev.lastRow = null;
}

function prepend(dev, row) {
  const list = dev.el.list;
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();
  list.prepend(row);
  while (list.children.length > MAX_ROWS) list.lastChild.remove();
}

function setStatus(dev, state, text) {
  dev.el.led.className = 'led' + (state === 'live' ? ' live' : state === 'error' ? ' error' : '');
  dev.el.status.textContent = text;
}
function setControls(dev, connected) {
  dev.el.connect.disabled = connected;
  dev.el.disconnect.disabled = !connected;
  dev.el.baud.disabled = connected;
  dev.el.parity.disabled = connected;
}
function blink(dev) {
  if (!dev.port) return;
  dev.el.led.classList.add('blink');
  clearTimeout(dev.blinkTimer);
  dev.blinkTimer = setTimeout(() => dev.el.led.classList.remove('blink'), 80);
}

setInterval(() => {
  devices.forEach(d => {
    d.el.bytes.textContent = d.bytes.toLocaleString();
    d.el.rate.textContent = ((d.bytes - d.bytesAtLastTick) * 2).toLocaleString();
    d.bytesAtLastTick = d.bytes;
    d.el.frames.textContent = d.frames.toLocaleString();
    d.el.unique.textContent = d.unique.size.toLocaleString();
  });
}, 500);

/* ---------- Toolbar ---------- */
const markerText = document.getElementById('markerText');
function addMarker() {
  const text = markerText.value.trim() || 'Marker';
  const time = new Date();
  pushLog({ time, dev: 'all', kind: 'marker', text });
  if (!paused) devices.forEach(d => {
    const row = document.createElement('div');
    row.className = 'row mark';
    row.innerHTML = `<span class="t">${clock(time)}</span><span></span><span>${escapeHtml(text)}</span>`;
    prepend(d, row);
    d.lastRow = null;
  });
  markerText.value = '';
  markerText.focus();
}
document.getElementById('markerBtn').addEventListener('click', addMarker);
markerText.addEventListener('keydown', e => { if (e.key === 'Enter') addMarker(); });

document.getElementById('pauseBtn').addEventListener('click', e => {
  paused = !paused;
  e.target.textContent = paused ? 'Resume display' : 'Pause display';
  document.getElementById('pauseNote').style.display = paused ? 'inline' : 'none';
  if (!paused) devices.forEach(d => d.lastRow = null);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (log.length && !confirm('Clear the screen and the recorded log? Save the log first if you need it.')) return;
  log.length = 0;
  devices.forEach(d => {
    d.el.list.innerHTML = '<div class="empty">No data yet.</div>';
    d.bytes = d.bytesAtLastTick = d.frames = 0;
    d.unique.clear();
    d.lastFrame = d.lastRow = null;
  });
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const lines = [
    'DSAN data logger capture',
    'Saved: ' + new Date().toString(),
    'Frame gap: ' + gapMs() + ' ms',
    ...devices.map(d => `${d.name}: ${d.el.baud.value} baud, ${d.el.parity.value} parity, ${d.bytes} bytes, ${d.frames} frames, ${d.unique.size} unique`),
    ''
  ];
  for (const e of log) {
    const who = e.dev === 'all' ? 'MARKER' : e.dev.toUpperCase();
    if (e.kind === 'frame') {
      const ascii = Array.from(e.bytes, b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join('');
      lines.push(`[${clock(e.time)}] ${who.padEnd(10)} ${String(e.bytes.length).padStart(4)}B  ${toHex(e.bytes)}  |${ascii}|`);
    } else {
      lines.push(`[${clock(e.time)}] ${who.padEnd(10)} ${e.kind === 'note' ? 'NOTE: ' : '>> '}${e.text}`);
    }
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `dsan-capture-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ---------- Helpers ---------- */
function pushLog(entry) { log.push(entry); if (log.length > MAX_LOG) log.shift(); }
function toHex(bytes) { return Array.from(bytes, b => b.toString(16).toUpperCase().padStart(2, '0')).join(' '); }
function sameBytes(a, b) { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
function pad(n) { return String(n).padStart(2, '0'); }
function clock(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, '0')}`; }
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
</script>
</body>
</html>
